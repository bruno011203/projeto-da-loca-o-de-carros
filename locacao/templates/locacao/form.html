{% extends "locacao/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card shadow-sm"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% include "locacao/_campos.html" %}
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary">{{ botao|default:"Salvar" }}</button>
      <a class="btn btn-outline-secondary" href="{% url voltar %}">Cancelar</a>
    </div>
  </form>
</div></div>
{% endblock %}
