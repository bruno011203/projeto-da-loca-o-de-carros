{% extends "locacao/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center"><div class="col-sm-8 col-md-5 col-lg-4">
  <div class="card shadow-sm mt-4"><div class="card-body p-4">
    <h1 class="h4 mb-3 text-center">Acesso do funcionário</h1>
    {% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Login</label>
        <input class="form-control" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Senha</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
