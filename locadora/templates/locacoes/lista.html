{% extends "base.html" %}
{% block titulo %}Locações{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Locações</h1>
  <a class="botao" href="{{ url_for('locadora.locacao_nova') }}">+ Nova locação</a>
</div>
<div class="filtros">
  <a class="{{ 'ativo' if not status }}" href="{{ url_for('locadora.locacoes') }}">Todas</a>
  {% for chave, nome in STATUS_LOCACAO.items() %}
    <a class="{{ 'ativo' if status == chave }}" href="{{ url_for('locadora.locacoes', status=chave) }}">{{ nome }}</a>
  {% endfor %}
</div>
{% include "locacoes/_tabela.html" %}
{% endblock %}
