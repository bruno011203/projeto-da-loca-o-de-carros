<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Painel{% endblock %} · Locadora</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('locadora.painel') }}">🚗 Locadora</a>
    <nav>
      <a href="{{ url_for('locadora.painel') }}">Painel</a>
      <a href="{{ url_for('locadora.locacoes') }}">Locações</a>
      <a href="{{ url_for('locadora.veiculos') }}">Veículos</a>
      <a href="{{ url_for('locadora.clientes') }}">Clientes</a>
    </nav>
  </header>
  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="alerta {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
